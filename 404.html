<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — INDICA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Jost:wght@200;300;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#f3f5f8;font-family:'Inter',system-ui,sans-serif;min-height:100svh;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
  .dots{display:flex;gap:11px;justify-content:center;margin-bottom:40px}
  .dots i{width:14px;height:14px;border-radius:50%;animation:morfa 5.6s cubic-bezier(.45,0,.2,1) infinite}
  .dots i:nth-child(2){animation-delay:.5s}
  .dots i:nth-child(3){animation-delay:1s}
  @keyframes morfa{
    0%,32%{border-radius:50%;transform:rotate(0deg)}
    42%,56%{border-radius:3px;transform:rotate(135deg)}
    66%,100%{border-radius:50%;transform:rotate(270deg)}}
  @media(prefers-reduced-motion:reduce){.dots i{animation:none}}
  .b{background:linear-gradient(150deg,#62c2ff,#2f6df0)}
  .g{background:linear-gradient(150deg,#c2ee5a,#5cbf1f)}
  .p{background:linear-gradient(140deg,#8ace2b,#ff2e9a)}
  img{height:clamp(48px,8vw,86px);width:auto;margin:0 auto 36px}
  ::selection{background:rgba(47,155,255,.35);color:#fff}
  h1{font-family:'Jost',sans-serif;font-weight:200;font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.05;
    letter-spacing:-.02em;margin-bottom:20px}
  h1 span{font-weight:600}
  p{color:#98a1ad;font-size:clamp(1rem,1.6vw,1.15rem);max-width:460px;margin:0 auto 34px}
  a.btn{display:inline-flex;background:#fff;color:#000;font-weight:600;font-size:15px;
    padding:14px 26px;border-radius:999px;text-decoration:none;transition:transform .22s}
  a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <main>
    <div class="dots" aria-hidden="true"><i class="b"></i><i class="g"></i><i class="p"></i></div>
    <img src="/assets/img/logo-master.png" alt="INDICA" width="3228" height="968" style="height:clamp(48px,8vw,86px)">
    <h1>Esta página<br>não <span>existe</span>.</h1>
    <p>O endereço que você tentou abrir não está aqui. Talvez tenha mudado de lugar.</p>
    <a class="btn" href="/">Voltar para o início</a>
  </main>
</body>
</html>
